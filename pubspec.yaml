name: hustlehub
description: A gig economy platform connecting clients with workers
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # Backend (Appwrite)
  appwrite: ^24.2.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.7.0

  # UI Components
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Forms & Validation
  reactive_forms: ^17.0.1
  form_validator: ^2.1.1

  # Image Handling
  image_picker: ^1.1.2
  image: ^4.2.0

  # Location
  geolocator: ^13.0.1

  # Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.5
  dartz: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/images/
    - assets/icons/

flutter_native_splash:
  color: "#0EA5E9"
  image: assets/images/logo.png
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
